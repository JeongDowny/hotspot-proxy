name: HotspotProxy
options:
  bundleIdPrefix: "${BUNDLE_PREFIX}"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HotspotProxy:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - target: HotspotProxyWidget
    entitlements:
      path: Config/HotspotProxy.entitlements
      properties:
        com.apple.security.application-groups: ["group.${BUNDLE_PREFIX}.hotspotproxy"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.hotspotproxy
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hotspot Proxy
        AppGroupIdentifier: "group.${BUNDLE_PREFIX}.hotspotproxy"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Coarse location updates keep the proxy running in the background. Your location is not stored or sent anywhere.
        NSLocationAlwaysAndWhenInUseUsageDescription: Coarse location updates keep the proxy running in the background. Your location is not stored or sent anywhere.
        NSLocalNetworkUsageDescription: Needed to accept proxy connections from devices on your Personal Hotspot.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ${BUNDLE_PREFIX}.hotspotproxy
            CFBundleURLSchemes: [hotspotproxy]
  HotspotProxyWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Config/HotspotProxyWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.${BUNDLE_PREFIX}.hotspotproxy"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.hotspotproxy.widget
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hotspot Proxy
        AppGroupIdentifier: "group.${BUNDLE_PREFIX}.hotspotproxy"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
